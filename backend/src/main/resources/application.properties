spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

server.port=${PORT:8080}

app.security.login.username-attempt-limit=${LOGIN_USERNAME_ATTEMPT_LIMIT:5}
app.security.login.ip-attempt-limit=${LOGIN_IP_ATTEMPT_LIMIT:25}
app.security.login.observation-window-minutes=${LOGIN_OBSERVATION_WINDOW_MINUTES:15}
app.security.login.max-tracked-keys=${LOGIN_MAX_TRACKED_KEYS:10000}

# Keep direct local requests authoritative. Set to FRAMEWORK only behind a trusted proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}
